# Python tests of this repo. The dev sandbox runs them with: uv run pytest
# On the host the suites run only through ./host-test.sh: a bare uv run there
# would make a .venv in the repo the dev sandbox shares.

[project]
name = "sbx"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests/unit/selfcheck", "tests/unit/init", "tests/unit/sbx", "tests/guard"]
pythonpath = [".", "base/selfcheck", "base/init", "claude/selfcheck/lib", "cursor/selfcheck/lib", "tests/integration"]
addopts = "-p no:cacheprovider"
