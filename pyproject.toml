# Python tests of this repo. Run them in the dev sandbox with: uv run pytest

[project]
name = "sbx"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests/selftest/selfcheck"]
addopts = "-p no:cacheprovider"
