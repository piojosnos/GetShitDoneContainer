# ------------------------------------------------------------------------------
# One sbx sandbox: one container, one folder mounted from the Mac
# ------------------------------------------------------------------------------
# Usage: SBX_NAME=demo SBX_DIR=/Users/you/sbx-demo docker compose up -d --wait
# SANDBOX.md explains the variables and the sandbox name rule.
# ------------------------------------------------------------------------------
name: "sbx-${SBX_NAME:?SBX_NAME is required (starts with a lowercase letter, then lowercase letters, digits or hyphens, 31 characters at most)}"

services:
  sandbox:
    # Built on the Mac with ./build.sh, from the repo root.
    image: sbx-claude:local
    pull_policy: never             # a missing image is an error, never a pull from Docker Hub
    container_name: "sbx-${SBX_NAME}"
    init: true                     # tini as PID 1: reaps zombies, stops promptly
    command: ["sleep", "infinity"] # shells come from: docker exec -it -w /home/sandbox/workspace/<name> sbx-<name> bash
    # working_dir is the mount point, not <name>/: Docker creates a missing
    # working directory, so a mistyped name leaves an empty <name>/ on the Mac.
    working_dir: "/home/sandbox/workspace"
    environment:
      SBX_NAME: "${SBX_NAME}"
    # No capability is needed: non-root, all writes go to the mounted folder.
    # If a host check fails only on cap_drop, remove it; keep no-new-privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      sbx.name: "${SBX_NAME}"
    # The one mount: $SBX_DIR holds <name>/ (code) and state/ (Claude, gh, git).
    # create_host_path: false refuses a missing folder instead of creating one.
    volumes:
      - type: bind
        source: "${SBX_DIR:?SBX_DIR is required (absolute host path of the sandbox folder)}"
        target: /home/sandbox/workspace
        bind:
          create_host_path: false

  # Never runs (scale 0): its image name holds SBX_NAME, and Docker refuses an
  # uppercase letter there, so up stops before it replaces anything.
  name-check:
    image: "sbx-${SBX_NAME}-name-check"
    pull_policy: never
    scale: 0
